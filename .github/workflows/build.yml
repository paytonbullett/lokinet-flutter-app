name: Build Lokinet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make automake libtool pkg-config cmake git

      - name: Set up Java (Required for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'

      - name: Patch Dependencies for Modern Dart/Flutter
        run: |
          sed -i 's/shared_preferences: *"\^0\.5\./shared_preferences: ">=0.5.12 <3.0.0"/g' pubspec.yaml

      - name: Install Android SDK NDK and CMake
        run: |
          # Automatically accept SDK licenses and install the required NDK/CMake components for native C++ compilation
          yes | sdkmanager --licenses
          sdkmanager "ndk;23.1.7779620" "cmake;3.22.1"

      - name: Verify Flutter Setup
        run: flutter doctor

      - name: Build Debug APK
        run: |
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lokinet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
