name: Build Lokinet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make automake libtool pkg-config cmake git

      - name: Set up Java (Required for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Set up Flutter FIRST so its environment takes place
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'

      # 2. Set up Android SDK and NDK AFTER Flutter
      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;23.1.7779620 cmake;3.22.1'

      # 3. Export the NDK path so Gradle actually reads it
      - name: Export Android NDK Path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
          echo "android.ndkVersion=23.1.7779620" >> android/local.properties || true

      - name: Patch Dependencies for Modern Dart/Flutter
        run: |
          sed -i 's/shared_preferences: *"\^0\.5\./shared_preferences: ">=0.5.12 <3.0.0"/g' pubspec.yaml

      - name: Verify Flutter Setup
        run: flutter doctor

      - name: Build Debug APK
        run: |
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lokinet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
