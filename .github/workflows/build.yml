name: Build Lokinet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make automake libtool pkg-config cmake git

      - name: Set up Java (Required for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Fix Dart SDK Constraint for Dart 3+
        run: |
          # Automatically update pubspec.yaml SDK lower bound to >=2.12.0 to support modern Dart SDKs
          sed -i 's/sdk: *">=2\.[0-7]\./sdk: ">=2.12.0/g' pubspec.yaml
          # Fallback general replacement if formatting differs
          sed -i 's/sdk: *">=2\.[0-11]\./sdk: ">=2.12.0/g' pubspec.yaml
          cat pubspec.yaml | grep sdk

      - name: Verify Flutter Setup
        run: flutter doctor

      - name: Build Debug APK
        run: |
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lokinet-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
